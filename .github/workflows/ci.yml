name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hms_user
          POSTGRES_PASSWORD: hms_password
          POSTGRES_DB: hms_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hms_user -d hms_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg2://hms_user:hms_password@localhost:5432/hms_test_db
      TEST_DATABASE_URL: postgresql+psycopg2://hms_user:hms_password@localhost:5432/hms_test_db
      JWT_SECRET_KEY: ci-test-secret-key-not-for-production
      ENVIRONMENT: testing
      DEBUG: "false"
      CORS_ORIGINS: '["http://localhost:5173"]'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.lock.txt

      - name: Ruff lint
        working-directory: backend
        run: ruff check app/ tests/

      - name: Ruff format check
        working-directory: backend
        run: ruff format --check app/ tests/

      - name: Run unit tests
        working-directory: backend
        run: pytest tests/unit/ -v --tb=short

      - name: Run integration tests
        working-directory: backend
        run: pytest tests/integration/ -v --tb=short --cov=app --cov-report=term-missing

  frontend-lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        working-directory: backend
        run: docker build -t hms-backend .

      - name: Verify container starts
        working-directory: backend
        run: |
          docker run -d --name hms-test \
            -e DATABASE_URL=sqlite:///./test.db \
            -e JWT_SECRET_KEY=test-secret \
            -p 8000:8000 \
            hms-backend
          sleep 5
          curl -f http://localhost:8000/health || exit 1
          docker stop hms-test
          docker rm hms-test

  docker-build-frontend:
    runs-on: ubuntu-latest
    needs: frontend-lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build frontend Docker image
        working-directory: frontend
        run: docker build -t hms-frontend .

      - name: Verify image built
        run: docker image inspect hms-frontend >/dev/null

  # Publishes deployable images on merges to main. This is where CD ends for
  # now: the repo names no hosting target or deploy credentials anywhere
  # (docs/deployment.md is generic Docker instructions only), so this stops
  # at "produce a versioned, pullable artifact" rather than guessing at a
  # live-server rollout. Point your infra at ghcr.io/<repo>/backend and
  # .../frontend, or extend this job once a real target exists.
  publish:
    runs-on: ubuntu-latest
    needs: [docker-build, docker-build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
